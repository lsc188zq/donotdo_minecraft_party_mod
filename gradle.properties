# Gradle 进程内存（模板默认 1G，开发机建议 2G，避免大任务内存不足）
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment 参数名映射（让 MC 反编译代码的参数名可读），版本与 NeoForge 21.11.45 官方模板一致
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Minecraft 版本必须与 Neo 版本对应才能获得有效构件
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.45

## 模组信息

# 模组唯一 ID：必须小写字母开头，仅含 [a-z0-9_]，与主类 @Mod 注解的常量一致
mod_id=partygame
# 模组显示名称
mod_name=Party Game
# 许可证
mod_license=All Rights Reserved
# 模组版本（语义化版本）
mod_version=0.1.0
# 包名（发布到 Maven 仓库时使用，与源码基础包名一致）
mod_group_id=com.partygame
